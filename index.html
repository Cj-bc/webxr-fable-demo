<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MR プレイルーム</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="landing">
      <h1>MR プレイルーム</h1>
      <p class="lead">自分の部屋で WebXR の複合現実機能を試すサンドボックスです。</p>
      <button id="enter" disabled>MR を開始</button>
      <p id="message" role="status"></p>
      <p class="camera">
        <button id="camera">カメラを許可</button>
        <span id="camera-status">許可すると、手で撮る写真に現実の景色が入ります (MR を開始する前に押してください)。</span>
      </p>
      <section id="gallery" hidden>
        <h2>撮った写真</h2>
        <p class="note">写真を押すと保存できます。ページを閉じると消えます。</p>
        <div id="photos"></div>
      </section>
      <table id="support">
        <thead>
          <tr>
            <th>機能</th>
            <th>このデモでの用途</th>
            <th>状態</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="note">
        「状態」は MR セッションを一度開始すると、ブラウザが実際に有効化したかどうかで更新されます。
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
